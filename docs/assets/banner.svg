<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0614"/><stop offset="0.55" stop-color="#150a2e"/><stop offset="1" stop-color="#06222b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff3cac"><animate attributeName="stop-color" values="#ff3cac;#22d3ee;#a3e635;#ff3cac" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#ff3cac;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a3e635;#ff3cac;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#ff3cac" stop-opacity="0.45"/><stop offset="1" stop-color="#ff3cac" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="440" rx="0"/></clipPath>
    <path id="a1" d="M840 110H856V210H870"/>
    <path id="a2" d="M840 220H870"/>
    <path id="a3" d="M840 330H856V230H870"/>
    <path id="h1" d="M941 220H973"/>
    <path id="h2" d="M941 208H955V198H973"/>
    <path id="h3" d="M941 232H955V242H973"/>
    <path id="o1" d="M1137 198H1158V150H1180"/>
    <path id="o2" d="M1137 220H1180"/>
    <path id="o3" d="M1137 242H1158V290H1180"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="440" fill="url(#bg)"/>

    <!-- drifting color blobs -->
    <circle r="260" fill="url(#blobA)">
      <animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;300;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="280" fill="url(#blobB)">
      <animate attributeName="cx" values="1100;880;1100" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="380;120;380" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- scrolling grid -->
    <rect x="0" y="-40" width="1280" height="520" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 40" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- floating sparkles -->
    <g fill="#fff" font-family="monospace" font-size="20" opacity="0.8">
      <text x="640" y="60">✦<animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/></text>
      <text x="40" y="410" fill="#22d3ee">✧<animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="6s" repeatCount="indefinite"/></text>
      <text x="1230" y="60" fill="#ff3cac">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></text>
      <text x="600" y="410" fill="#a3e635">+<animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></text>
    </g>

    <!-- traces -->
    <g fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.45">
      <use href="#a1"/><use href="#a2"/><use href="#a3"/><use href="#h1"/><use href="#h2"/><use href="#h3"/>
      <use href="#o1"/><use href="#o2"/><use href="#o3"/>
    </g>
    <!-- data packets: agents -> MCP -> chip -> toolchains -->
    <g filter="url(#glow)">
      <circle r="4.5" fill="#ff3cac"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="4.5" fill="#a3e635"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0.5s"><mpath href="#a2"/></animateMotion></circle>
      <circle r="4.5" fill="#22d3ee"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.9s"><mpath href="#a3"/></animateMotion></circle>
      <circle r="4.5" fill="#fff"><animateMotion dur="0.9s" repeatCount="indefinite" begin="0.3s"><mpath href="#h1"/></animateMotion></circle>
      <circle r="4" fill="#fff"><animateMotion dur="1.1s" repeatCount="indefinite" begin="0.7s"><mpath href="#h2"/></animateMotion></circle>
      <circle r="4" fill="#fff"><animateMotion dur="1.1s" repeatCount="indefinite" begin="0.1s"><mpath href="#h3"/></animateMotion></circle>
      <circle r="4.5" fill="#a3e635"><animateMotion dur="1.3s" repeatCount="indefinite" begin="1s"><mpath href="#o1"/></animateMotion></circle>
      <circle r="4.5" fill="#ff3cac"><animateMotion dur="1s" repeatCount="indefinite" begin="1.2s"><mpath href="#o2"/></animateMotion></circle>
      <circle r="4.5" fill="#22d3ee"><animateMotion dur="1.3s" repeatCount="indefinite" begin="1.4s"><mpath href="#o3"/></animateMotion></circle>
    </g>

    <!-- AI agents -->
    <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700">
      <g><rect x="730" y="92" width="110" height="36" rx="18" fill="#ff3cac" fill-opacity="0.15" stroke="#ff3cac" stroke-width="1.5"/>
        <text x="753" y="116" fill="#ff3cac" font-size="16">✦<animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></text><text x="771" y="115" fill="#ffd1ec">Claude</text></g>
      <g><rect x="730" y="202" width="110" height="36" rx="18" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-width="1.5"/>
        <text x="753" y="226" fill="#a3e635" font-size="16">✦<animate attributeName="opacity" values="1;0.3;1" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></text><text x="771" y="225" fill="#ecfccb">Codex</text></g>
      <g><rect x="730" y="312" width="110" height="36" rx="18" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="753" y="336" fill="#22d3ee" font-size="16">✦<animate attributeName="opacity" values="1;0.3;1" dur="1.4s" begin="0.8s" repeatCount="indefinite"/></text><text x="771" y="335" fill="#cffafe">Hermes</text></g>
    </g>

    <!-- MCP hub -->
    <g>
      <circle cx="905" cy="220" r="46" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0 905 220" to="360 905 220" dur="12s" repeatCount="indefinite"/>
      </circle>
      <polygon points="905,186 934,203 934,237 905,254 876,237 876,203" fill="#150a2e" stroke="#a78bfa" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke" values="#a78bfa;#ff3cac;#22d3ee;#a78bfa" dur="4s" repeatCount="indefinite"/>
      </polygon>
      <text x="905" y="226" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" font-weight="800" fill="#ede9fe">MCP</text>
      <text x="905" y="282" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12" fill="#a78bfa">tools/call</text>
    </g>

    <!-- IC package -->
    <g>
      <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="butt" opacity="0.9"><path d="M973 154H985M1125 154H1137"/><path d="M973 176H985M1125 176H1137"/><path d="M973 198H985M1125 198H1137"/><path d="M973 220H985M1125 220H1137"/><path d="M973 242H985M1125 242H1137"/><path d="M973 264H985M1125 264H1137"/><path d="M973 286H985M1125 286H1137"/><path d="M1000 128V140M1000 300V312"/><path d="M1022 128V140M1022 300V312"/><path d="M1044 128V140M1044 300V312"/><path d="M1066 128V140M1066 300V312"/><path d="M1088 128V140M1088 300V312"/><path d="M1110 128V140M1110 300V312"/></g>
      <polygon points="985,140 1115,140 1125,150 1125,300 985,300" fill="#0d0820" stroke="url(#neon)" stroke-width="3.5" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2.5;5;2.5" dur="2s" repeatCount="indefinite"/>
      </polygon>
      <rect x="995" y="150" width="120" height="140" rx="4" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-dasharray="2 3"/>
      <circle cx="1002" cy="288" r="5" fill="none" stroke="#a3e635" stroke-width="1.5"/>
      <rect x="1018" y="170" width="74" height="50" rx="3" fill="#1a0f3a" stroke="#22d3ee" stroke-opacity="0.6"/>
      <g stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1"><path d="M1030 182h50M1030 195h36M1030 208h44"/></g>
      <rect x="1018" y="170" width="74" height="3" fill="#a3e635" opacity="0.8">
        <animate attributeName="y" values="170;217;170" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="1055" y="246" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" font-weight="800" fill="url(#neon)">VERILOG</text>
      <text x="1055" y="264" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" font-weight="800" fill="url(#neon)">BUILDER</text>
      <text x="1112" y="282" text-anchor="end" font-family="monospace" font-size="9" fill="#94a3b8">RTL·SYN·SIM</text>
    </g>

    <!-- toolchain outputs -->
    <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="1180" y="136" width="90" height="28" rx="14" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-width="1.5"/><text x="1225" y="155" fill="#ecfccb">Vivado</text>
      <rect x="1180" y="206" width="90" height="28" rx="14" fill="#ff3cac" fill-opacity="0.12" stroke="#ff3cac" stroke-width="1.5"/><text x="1225" y="225" fill="#ffd1ec">Icarus</text>
      <rect x="1180" y="276" width="90" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1.5"/><text x="1225" y="295" fill="#cffafe">GTKWave</text>
    </g>

    <!-- title with glitch layers -->
    <g font-family="'DejaVu Sans',Verdana,Arial,sans-serif" font-size="80" font-weight="900">
      <text x="64" y="160" fill="#ff3cac" opacity="0.7">Verilog Builder
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0;3 0;0 0" keyTimes="0;0.02;0.05;0.07;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="160" fill="#22d3ee" opacity="0.7">Verilog Builder
        <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0;-3 0;0 0" keyTimes="0;0.02;0.05;0.07;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="160" fill="#ffffff">Verilog Builder</text>
    </g>
    <rect x="64" y="182" width="120" height="6" rx="3" fill="url(#neon)">
      <animate attributeName="width" values="120;470;120" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline: typed-in feel -->
    <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="25" fill="#e9d5ff">
      <text x="64" y="240">&gt; just prompt it. we handle the Vivado.</text>
      <text x="64" y="278" fill="#a3e635">&gt; build · fix · sim · ship<tspan fill="#ff3cac">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan></text>
    </g>

    <!-- pipeline pills -->
    <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="18" text-anchor="middle">
      <rect x="64" y="322" width="140" height="42" rx="21" fill="#ff3cac" fill-opacity="0.15" stroke="#ff3cac" stroke-width="1.5"/>
      <text x="134" y="349" fill="#ffd1ec">LLM prompt</text>
      <text x="228" y="350" fill="#a3e635" font-size="22">→<animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></text>
      <rect x="250" y="322" width="150" height="42" rx="21" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="325" y="349" fill="#ede9fe">MCP server</text>
      <text x="424" y="350" fill="#a3e635" font-size="22">→<animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></text>
      <rect x="446" y="322" width="190" height="42" rx="21" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="541" y="349" fill="#cffafe">Vivado | Icarus</text>
    </g>

    <!-- scanline sweep -->
    <rect x="0" width="1280" height="3" fill="#fff" opacity="0.06">
      <animate attributeName="y" values="-5;445" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
